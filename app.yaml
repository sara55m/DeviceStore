kind: wasmer.io/App.v0
name: devicestore
owner: sara55m
package: sha256:10e6438a32f580f65b59ddae132fc5f4e585b44fcd08e8c5bf6a448d336ccd8f


jobs:
  - name: migrate-database
    trigger: pre-deployment
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force
        timeout: 5m

  - name: clear-laravel-cache
    trigger: post-deployment
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - optimize:clear
        timeout: 5m

volumes:
  - name: devicestore-logs
    mount: /app/storage/logs
  - name: devicestore-public
    mount: /app/storage/app/public
